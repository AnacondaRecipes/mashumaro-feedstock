{% set name = "mashumaro" %}
{% set version = "3.14" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5ef6f2b963892cbe9a4ceb3441dfbea37f8c3412523f25d42e9b3a7186555f1d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
    - typing-extensions >=4.1.0
  run_constrained:
    # msgpack
    - msgpack-python >=0.5.6
    # toml
    - tomli-w >=1.0
    - tomli >=1.1.0  # [py<311]
    # yaml
    - pyyaml >=3.13

# The 3.14 PyPI sdist does not ship tests/entities.py, tests/utils.py, or
# tests/conftest.py (they exist in the GitHub repo but are excluded from the
# tarball manifest). Any test file that imports from those helpers fails at
# collection time with ModuleNotFoundError. This was fixed in the 3.21 sdist,
# which includes them — the 3.21 recipe runs pytest with no ignores at all.
{% set tests_missing_helpers = [
  "--ignore=tests/test_config.py",
  "--ignore=tests/test_data_types.py",
  "--ignore=tests/test_dialect.py",
  "--ignore=tests/test_generics.py",
  "--ignore=tests/test_generics_pep_695.py",
  "--ignore=tests/test_json.py",
  "--ignore=tests/test_literal.py",
  "--ignore=tests/test_meta.py",
  "--ignore=tests/test_metadata_options.py",
  "--ignore=tests/test_pep_563.py",
  "--ignore=tests/test_types.py",
  "--ignore=tests/test_union.py",
] %}
# test_pep_695.py uses the PEP 695 `type` keyword syntax, available only in Python 3.12+.
{% set tests_pep695_syntax = [
  "--ignore=tests/test_pep_695.py",
] %}

test:
  source_files:
    - tests
  imports:
    - mashumaro
    - mashumaro.codecs
    - mashumaro.codecs._builder
    - mashumaro.config
    - mashumaro.core
    - mashumaro.core.const
    - mashumaro.core.helpers
    - mashumaro.core.meta.code.builder
    - mashumaro.core.meta.code.lines
    - mashumaro.core.meta.helpers
    - mashumaro.core.meta.mixin
    - mashumaro.core.meta.types.common
    - mashumaro.core.meta.types.pack
    - mashumaro.core.meta.types.unpack
    - mashumaro.dialect
    - mashumaro.exceptions
    - mashumaro.helper
    - mashumaro.jsonschema         # [py<314]
    - mashumaro.jsonschema.annotations  # [py<314]
    - mashumaro.jsonschema.dialects     # [py<314]
    - mashumaro.jsonschema.models       # [py<314]
    - mashumaro.jsonschema.schema       # [py<314]
    - mashumaro.mixins
    - mashumaro.mixins.dict
    - mashumaro.mixins.msgpack
    - mashumaro.mixins.orjson
    - mashumaro.mixins.toml
    - mashumaro.types
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v {{ (tests_missing_helpers + tests_pep695_syntax) | join(" ") }} tests  # [py<312]
    - pytest -v {{ tests_missing_helpers | join(" ") }} tests  # [py>=312]
  requires:
    - pip
    - pytest >=6.2.1
    - pytest-mock >=3.5.1
    - msgpack-python >=0.5.6
    - orjson
    - tomli-w >=1.0
    - pyyaml >=3.13
    - ciso8601 >=2.1.3
    - pendulum >=2.1.2

about:
  home: https://github.com/Fatal1ty/mashumaro
  summary: Fast and well tested serialization library
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    In Python, you often need to dump and load objects based on the schema you have. It can be a dataclass model, a list
    of third-party generic classes or whatever. Mashumaro not only lets you save and load things in different ways, but it
    also does it super quick.
  doc_url: https://github.com/Fatal1ty/mashumaro/blob/master/README.md
  dev_url: https://github.com/Fatal1ty/mashumaro

extra:
  recipe-maintainers:
    - thewchan
    - maresb
